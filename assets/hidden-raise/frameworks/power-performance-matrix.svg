<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Power and Performance Matrix</title><desc id="desc">A matrix with Performance increasing to the right and Influence increasing upward. The four positions are Overlooked, Visible Doer, Specialist, and Trusted Partner.</desc>
  <rect width="800" height="560" fill="#fffdf8"/>
  <g font-family="Arial, sans-serif" fill="#162d3c">
    <text x="54" y="54" font-size="14" font-weight="700" letter-spacing="2" fill="#187d7a">THE HIDDEN RAISE FRAMEWORK</text>
    <text x="54" y="92" font-family="Georgia, serif" font-size="34">Power &amp; Performance Matrix</text>
    <text x="54" y="124" font-size="17" fill="#506c7d">Where are you today—and what would make your contribution easier to recognize?</text>
    <g transform="translate(150 174)">
      <path d="M0 310V0M0 310H550" stroke="#162d3c" stroke-width="5" fill="none"/><path d="M-9 12 0 0 9 12M538 301 550 310 538 319" fill="none" stroke="#162d3c" stroke-width="5"/>
      <rect x="8" y="8" width="264" height="144" fill="#eaf2ef" stroke="#fffdf8" stroke-width="7"/><rect x="278" y="8" width="264" height="144" fill="#dbe9e4" stroke="#fffdf8" stroke-width="7"/>
      <rect x="8" y="158" width="264" height="144" fill="#f0f1ed" stroke="#fffdf8" stroke-width="7"/><rect x="278" y="158" width="264" height="144" fill="#fff0e7" stroke="#fffdf8" stroke-width="7"/>
      <g text-anchor="middle"><text x="140" y="77" font-size="20" font-weight="700">SPECIALIST</text><text x="410" y="77" font-size="20" font-weight="700">TRUSTED PARTNER</text><text x="410" y="109" font-size="13" fill="#506c7d">strong work, trusted context</text><text x="140" y="228" font-size="20" font-weight="700">OVERLOOKED</text><text x="140" y="260" font-size="13" fill="#506c7d">strong work, low visibility</text><text x="410" y="228" font-size="20" font-weight="700">VISIBLE DOER</text></g>
      <text x="272" y="365" font-size="17" font-weight="700" text-anchor="middle">PERFORMANCE →</text><text x="-152" y="-88" font-size="17" font-weight="700" text-anchor="middle" transform="rotate(-90)">INFLUENCE →</text>
    </g>
    <text x="400" y="518" font-size="14" fill="#506c7d" text-anchor="middle"><tspan x="400" dy="0">The point is not to perform visibility.</tspan><tspan x="400" dy="19">It is to make useful work legible in ways that build trust.</tspan></text>
  </g>
</svg>