<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Career Value Ladder</title><desc id="desc">A five-rung ladder progressing from Execute Reliably, to Solve Well, Connect Context, Anticipate, and Multiply.</desc>
  <rect width="800" height="560" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#162d3c"><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="2" fill="#187d7a">THE HIDDEN RAISE FRAMEWORK</text><text x="54" y="92" font-family="Georgia, serif" font-size="34">Career Value Ladder</text><text x="54" y="124" font-size="17" fill="#506c7d">Contribution grows as your work broadens another person’s capacity.</text><g transform="translate(115 164)"><rect x="236" y="0" width="214" height="48" fill="#ee6843" stroke="#162d3c" stroke-width="3"/><rect x="180" y="64" width="326" height="54" fill="#eaf2ef" stroke="#162d3c" stroke-width="3"/><rect x="120" y="134" width="446" height="54" fill="#eaf2ef" stroke="#162d3c" stroke-width="3"/><rect x="60" y="204" width="566" height="54" fill="#eaf2ef" stroke="#162d3c" stroke-width="3"/><rect x="0" y="274" width="686" height="54" fill="#eaf2ef" stroke="#162d3c" stroke-width="3"/><g font-size="17" font-weight="700" text-anchor="middle"><text x="343" y="31" fill="#fffdf8">5 · MULTIPLY</text><text x="343" y="98">4 · ANTICIPATE</text><text x="343" y="168">3 · CONNECT CONTEXT</text><text x="343" y="238">2 · SOLVE WELL</text><text x="343" y="308">1 · EXECUTE RELIABLY</text></g></g><text x="54" y="512" font-size="14" fill="#506c7d"><tspan x="54" dy="0">Each rung asks: What am I doing? What problem am I solving?</tspan><tspan x="54" dy="18">What context am I connecting? What can I see coming?</tspan><tspan x="54" dy="18">Who becomes more capable because of my work?</tspan></text></g>
</svg>