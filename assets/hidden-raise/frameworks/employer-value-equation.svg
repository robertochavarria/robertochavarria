<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Employer Value Equation</title><desc id="desc">Three elements, Outcomes, Risk Reduced, and Trust Built, combine to create clearer contribution.</desc>
  <rect width="800" height="560" fill="#162d3c"/><g font-family="Arial, sans-serif"><text x="54" y="56" font-size="14" font-weight="700" letter-spacing="2" fill="#5cc3bd">THE HIDDEN RAISE FRAMEWORK</text><text x="54" y="98" font-family="Georgia, serif" font-size="36" fill="#fffdf8">Employer Value Equation</text><text x="54" y="130" font-size="17" fill="#dbe7ea">A useful way to understand the consequences your work helps create or avoid.</text>
  <g transform="translate(54 205)"><rect width="192" height="120" rx="7" fill="#fffdf8"/><rect x="254" width="192" height="120" rx="7" fill="#f9b56d"/><rect x="508" width="192" height="120" rx="7" fill="#fffdf8"/><g text-anchor="middle"><text x="96" y="53" font-size="19" font-weight="700" fill="#162d3c">OUTCOMES</text><text x="96" y="82" font-size="13" fill="#506c7d">progress made possible</text><text x="350" y="53" font-size="19" font-weight="700" fill="#162d3c">RISK REDUCED</text><text x="350" y="82" font-size="13" fill="#506c7d">problems made smaller</text><text x="604" y="53" font-size="19" font-weight="700" fill="#162d3c">TRUST BUILT</text><text x="604" y="82" font-size="13" fill="#506c7d">capacity across people</text></g><text x="223" y="73" font-size="38" fill="#fffdf8">+</text><text x="477" y="73" font-size="38" fill="#fffdf8">+</text></g><path d="M150 371H650" stroke="#f9b56d" stroke-width="2"/><text x="400" y="432" font-family="Georgia, serif" font-size="30" fill="#f9b56d" text-anchor="middle">= clearer contribution</text><text x="400" y="474" font-size="15" fill="#dbe7ea" text-anchor="middle"><tspan x="400" dy="0">Name what changed, what became safer,</tspan><tspan x="400" dy="20">and whose work became easier.</tspan></text></g>
</svg>